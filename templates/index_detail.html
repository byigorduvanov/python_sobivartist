{% extends 'layout.html' %}

{% block content %}

<div  class="ui container">

    <div class="ui padded segment">
        <div class="ui center aligned container">
            <a href="addall"><button class="ui teal button" type="submit">Додавання даних</button></a>
            <a href="/"><button class="ui teal  button" type="submit">На головну</button></a>
        </div>
    </div>

    <div class="ui segment">
        <h1 class="ui center aligned header teal">{{ 'ДОДАТИ ДЕТАЛЬ' }}</h1>

        <form class="ui large form" action="{{ url_for('adddetail') }}" method="post">
            <div class="ui segment">
                <div class="field">
                    <label>Нова деталь</label>
                    <input type="text" name="coding" placeholder="Кодування">
                    <input type="text" name="name" placeholder="Найменування">
                    <div>
                        <input type="radio" name="product_type" value="1" checked> Деталь
                        <input type="radio" name="product_type" value="3"> Збірна одиниця
                        <input type="radio" name="product_type" value="4"> Готова продукція (КРАН)
                    </div>
                    <input type="text" name="lenght_workpiece" placeholder="Довжина заготовки">
                    <input type="text" name="width_workpiece" placeholder="Ширина заготовки">
                    <input type="text" name="trimming" placeholder="Торцовка">
                    <input type="text" name="lenght_detail" placeholder="Довжина деталі">
                    <input type="text" name="rate_costs" placeholder="Норма розтрат">
                    <div class="field">
                        <label>Матеріал</label>
                        <input list="material_id" name="material_id" placeholder="Матеріал">
                        <datalist id="material_id">
                            {% for material in material_list %}
                            <option value="{{ material.id }}">{{ material.marka }}  {{ material.profile }}</option>
                            {% endfor %}
                        </datalist>
                    </div>
                    <button class="ui fluid large teal submit button" type="submit">Добавити</button>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock content %}
