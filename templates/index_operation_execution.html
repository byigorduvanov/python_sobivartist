{% extends 'layout.html' %}

{% block content %}

<div style="margin-top: 50px;" class="ui container">
    <body>  
        <a href="/"><button class="ui teal basic button" type="submit">На головну</button></a>
     </body>
    </form>
</div>

<head>
    <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      text-align: left;
    }
    </style>
</head>

<div style="margin-top: 50px;" class="ui container">
  <h1 class="ui center aligned header green">{{ 'Виконання опрерації' }}</h1>

  <form class="ui form" action="{{ url_for('operation_execution') }}" method="post">
    <div class="field">
    <label>ДЕТАЛЬ</label>
   
    <input list="operation_id" name="operation_id"  placeholder="Виберіть операцію">
    <datalist id="operation_id">           
      {% for operation in operation_list %}        
      <option value="{{ operation.id }}">{{ operation.name }} </option>
      {% endfor %}  
    </datalist>


    <input list="detail_id" name="detail_id"  placeholder="Деталь">
    <datalist id="detail_id">           
      {% for detail in detail_list %}        
        <option value="{{ detail.id }}">{{ detail.coding }}  {{ detail.name }}</option>
      {% endfor %}  
    </datalist>

  <input list="material_coming_id" name="material_coming_id"  placeholder="Матеріал">
    <datalist id="material_coming_id">           
      {% for material_coming in material_coming_list %}        
        <option value="{{ material_coming.id }}">{{ material_coming.material_id }} </option>
      {% endfor %}  
    </datalist>

    <input type="text" name="number" placeholder="Кількість деталей"><br>    

    <button class="ui teal basic button" type="submit">Додати виконання операції</button>
    </div>
</div>

</head>
<body>

{% endblock content %}
