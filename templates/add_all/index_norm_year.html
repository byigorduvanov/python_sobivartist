{% extends 'layout.html' %}

{% block content %}

<div class="ui container">
    <div class="ui padded segment">
        <div class="ui center aligned container">
            <a href="addall"><button class="ui teal button" type="submit">Додавання даних</button></a>
            <a href="/"><button class="ui teal  button" type="submit">На головну</button></a>
        </div>
    </div>

    <div class="ui segment">
        <h1 class="ui center aligned header teal">{{ 'ДОДАТИ НОРМОВИТРАТИ' }}</h1>

        <form class="ui large form" action="{{ url_for('norm_year') }}" method="post">
            <div class="ui segment">
                <div class="field">
                    <label>Кодування деталі</label>
                    <input list="detail_id" name="detail_id">
                    <datalist id="detail_id">
                        {% for detail in detail_list %}
                        <option value="{{ detail.id }}">{{ detail.coding }}  {{ detail.name }}</option>
                        {% endfor %}
                    </datalist>

                    <input type="text" name="norm_year_coding" placeholder="Кодування"><br>
                    <input type="text" name="norm_years" placeholder="Нормо години на 1 деталь"><br>

                    <button class="ui fluid large teal submit button" type="submit">Добавити нормовитрати</button>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock content %}
