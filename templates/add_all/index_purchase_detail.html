{% extends 'layout.html' %}

{% block content %}

<div  class="ui container">
    <div class="ui padded segment">
        <div class="ui center aligned container">
            <a href="add_all"><button class="ui teal button" type="submit">Додавання даних</button></a>
            <a href="/"><button class="ui teal  button" type="submit">На головну</button></a>
        </div>
    </div>

    <div class="ui segment">
        <h1 class="ui center aligned header teal">{{ 'ДОДАТИ ПОКУПНУ ДЕТАЛЬ' }}</h1>

        <form class="ui large form" action="{{ url_for('purchase_detail') }}" method="post">
            <div class="ui segment">
                <div class="field">
                    <label>Нова деталь</label>
                    <input type="text" name="coding" placeholder="Кодування">
                    <input type="text" name="name" placeholder="Найменування">
                    <input type="text" name="price" placeholder="Ціна за 1 штуку">
                    <button class="ui fluid large teal submit button" type="submit">Добавити</button>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock content %}
