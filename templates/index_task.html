{% extends 'layout.html' %}

{% block content %}

<div style="margin-top: 50px;" class="ui container">
    <body>  
        <a href="/"><button class="ui teal basic button" type="submit">На головну</button></a>
     </body>
    </form>
</div>

<div style="margin-top: 50px;" class="ui container">

    <form class="ui form" action="{{ url_for('add') }}" method="post">
       
    <h1 class="ui center aligned header green">{{ 'ДОДАТИ ЗАВДАННЯ' }}</h1>
        <div class="field">
            <label>Нова задача</label>
            <input type="text" name="title" placeholder="Ввести задачу"><br>
        </div>
        <button class="ui teal basic button" type="submit">Добавити</button>
    </form>


    {% for task in task_list %}
    <div class="ui segment">
        <p class="ui big header">№{{ task.id }} {{ task.title }}</p>

        {% if task.is_complete == False %}
        <span class="ui gray label">Не завершено</span>
        <a class="ui primary basic button" href="{{ url_for('update', task_id=task.id) }}">Закрити</a>
        {% else %}
        <span class="ui green label">Завершено</span>
        <a class="ui blue button" href="{{ url_for('update', task_id=task.id) }}">Відкрити</a>
        <a class="ui negative basic button" href="{{ url_for('delete', task_id=task.id) }}">Видалити</a>
        {% endif %}
    </div>
    {% endfor %}
</div>
{% endblock content %}
