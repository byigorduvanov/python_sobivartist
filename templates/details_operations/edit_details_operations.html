{% extends 'layout.html' %}
{% block content %}
<div class="ui container">
    <div class="ui segment">
        <h1 class="ui center aligned header teal">Редагувати детальну операцію</h1>

        <form class="ui large form" action="{{ url_for('update_detail_operations', detail_operations_id=detail_operations.id) }}" method="post">
            <div class="ui segment">
               <div class="field">
                    <label>Нова  Операція для ДЕТАЛЕЙ</label>
                   <div class="field">
                    <label>ID Деталі</label>
                        <select name="detail_id">
                            {% for detail in details %}
                            <option value="{{ detail.id }}">
                                {{ detail.coding }} - {{ detail.name }}
                                {% if detail.Material %}
                                ({{ detail.Material.profile }}, {{ detail.Material.marka }})
                                {% endif %}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                <div class="field">
                    <label>ID Операції</label>
                    <select name="operations_id">
                        {% for operation in operations %}
                        <option value="{{ operation.id }}">{{ operation.coding }} - {{ operation.name }}</option>
                        {% endfor %}
                    </select>
                </div>
               </div>
                <div class="field">
                    <label>Назва</label>
                    <div class="ui input">
                        <input type="text" name="name" value="{{ detail_operations.name }}">
                    </div>
                </div>
                <div class="field">
                    <label>Тип</label>
                    <div class="ui input">
                        <input type="text" name="type" value="{{ detail_operations.type }}">
                    </div>
                </div>
                <div class="field">
                    <label>Нотатки</label>
                    <div class="ui input">
                        <input type="text" name="notes" value="{{ detail_operations.notes }}">
                    </div>
                </div>
                <button class="ui fluid large teal submit button" type="submit">Оновлення</button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
