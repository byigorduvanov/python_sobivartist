<head>
    <style>
    table, th, td {

      border-collapse: collapse;

    }
    </style>
</head>


<div style="margin-top: 50px;" class="ui container">

    <div class="field">
    <label>ЗБІРНА ОДИНИЦЯ</label>
   
    <select name="A">
        {% for collective in collective_list %}        
        <option value="{{ collective.collective_id }}">{{ collective.collective_coding }} </option>

    </select>

    <h2>ДЕТАЛІ</h2>
<table style="width:50%">
  <tr>
    <th>Кодування</th>
    <th>Найменування</th>
    <th>Кількість</th>
  </tr>
  <tr>
    {% for specification in specification_list %}
      <th> {{ specification.coding }} </th>
      <th> {{ specification.name }} </th>
      <th> {{ specification.number }} </th>
  </tr>
    {% endfor %}
</table>
    <button class="ui teal basic button" type="submit">ВИВЕСТИ СПЕЦИФІКАЦІЮ</button>
