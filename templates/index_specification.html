{% extends 'layout.html' %}

{% block content %}

<div class="ui container">
    <div class="ui padded segment">
        <div class="ui center aligned container">
            <a href="revision" class="ui teal button">Перегляд даних</a>
            <a href="/"><button class="ui teal  button">На головну</button></a>
        </div>
    </div>
    <form class="ui form" action="{{ url_for('dele_spec') }}" method="post">
        <button class="ui teal  button" type="submit">ОЧИСТИТИ</button>
    </form>

    <h1 class="ui center aligned header ">ВИВЕСТИ СПЕЦИФІКАЦІЮ</h1>
    <form class="ui form" action="{{ url_for('specification') }}" method="post">
        <div class="field">
            <label>ЗБІРНА ОДИНИЦЯ</label>
            <select name="A">
                {% for collective in collective_list %}
                    <option value="{{ collective.collective_id }}">{{ collective.collective_coding }}</option>
                {% endfor %}
            </select>
            <button class="ui teal  button" type="submit">ВИВЕСТИ СПЕЦИФІКАЦІЮ</button>
        </div>
    </form>

    <h2 class="ui center aligned header">ДЕТАЛІ</h2>
    <table class="ui celled table">
        <thead>
            <tr>
                <th>Кодування</th>
                <th>Найменування</th>
                <th>Кількість</th>
            </tr>
        </thead>
        <tbody>
            {% for specification in specification_list %}
                <tr>
                    <td> {{ specification.coding }} </td>
                    <td> {{ specification.name }} </td>
                    <td> {{ specification.number }} </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock content %}
